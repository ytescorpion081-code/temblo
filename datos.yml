name: Actualizar datos automáticos
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datos
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Listado del IGC-UP
        run: python igc.py
        continue-on-error: true
      - name: Titulares de noticias
        run: python noticias.py
        continue-on-error: true
      - name: Guardar si cambió
        run: |
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add igc.json noticias.json
          git diff --cached --quiet || (git commit -m "Actualizar datos automáticos" && git pull --rebase -q && git push)
