name: Actualizar titulares de noticias
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: igc
  cancel-in-progress: false
jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar titulares
        run: python noticias.py
      - name: Guardar si cambió
        if: always()
        run: |
          git config user.name "igc-bot"
          git config user.email "igc-bot@users.noreply.github.com"
          if [ -f noticias.json ]; then git add noticias.json; fi
          git diff --cached --quiet || (git commit -m "Actualizar titulares (bot)" && git pull --rebase -q && git push)
