name: Automatizar todo (sismos, noticias y avisos)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar notificacion de prueba al telefono"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: igc
  cancel-in-progress: false
jobs:
  todo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 1. Listado del IGC-UP
        continue-on-error: true
        run: python igc.py

      - name: 2. Titulares de noticias
        continue-on-error: true
        run: python noticias.py

      - name: 3. Avisos al telefono (ntfy)
        continue-on-error: true
        env:
          PRUEBA: ${{ inputs.prueba }}
          AVISO_MAGNITUD: ${{ vars.AVISO_MAGNITUD }}
        run: python ntfy_avisos.py

      - name: 4. Avisos por Telegram (opcional)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          AVISO_MAGNITUD: ${{ vars.AVISO_MAGNITUD }}
          AVISO_EDAD_MIN: ${{ vars.AVISO_EDAD_MIN }}
        run: python avisos.py

      - name: 5. Guardar si cambio
        if: always()
        run: |
          git config user.name "igc-bot"
          git config user.email "igc-bot@users.noreply.github.com"
          for f in igc.json igc_estado.json avisos_estado.json noticias.json ntfy_estado.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || (git commit -m "Actualizar datos (bot)" && git pull --rebase -q && git push)
