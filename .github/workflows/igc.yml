name: Actualizar listado IGC-UP
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: igc
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar listado del IGC-UP
        run: python igc.py
      - name: Guardar si cambió
        run: |
          git config user.name "igc-bot"
          git config user.email "igc-bot@users.noreply.github.com"
          git add igc.json igc_estado.json
          git diff --cached --quiet || (git commit -m "Actualizar igc.json" && git pull --rebase -q && git push)
